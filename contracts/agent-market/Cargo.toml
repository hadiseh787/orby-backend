[package]
name = "agent-market"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }
borsh = "1"
agent-financial = {path="financial"}

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[workspace]
members = ["financial"]
default-members = ["financial"]
